version: '3.8'

# LaunchPad SaaS OS — Production Docker Compose Stack Specification
# Usage: docker-compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchpad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_THIS_SECURE_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad_os_prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-launchpad_admin} -d ${POSTGRES_DB:-launchpad_os_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - launchpad_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchpad-backend-prod
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./backend/.env.production
    environment:
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - launchpad_prod_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchpad-frontend-prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - launchpad_prod_net

volumes:
  postgres_prod_data:
    driver: local

networks:
  launchpad_prod_net:
    driver: bridge
