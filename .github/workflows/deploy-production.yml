name: LaunchPad V1 Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v1.0.0-production'
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Production Pre-flight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Prisma Generate & Validate
        run: |
          cd backend
          npx prisma generate
          npx prisma validate

      - name: Run Backend Integration & Unit Test Suite
        run: cd backend && npm test

      - name: Run Frontend Typecheck & Production Build Validation
        run: |
          npx tsc --noEmit
          npm run build
          cd backend && npm run build

  build-and-package:
    name: Docker Production Image Build & Tagging
    needs: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image
        run: |
          docker build \
            --tag launchpad-backend:v1.0.0-production \
            --tag launchpad-backend:latest \
            ./backend

      - name: Build Frontend Production Image
        run: |
          docker build \
            --tag launchpad-frontend:v1.0.0-production \
            --tag launchpad-frontend:latest \
            .

  release-summary:
    name: V1 Production Release Summary
    needs: build-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Report Deployment Readiness
        run: |
          echo "🚀 LaunchPad V1 Release Artifacts Verified"
          echo "Tag: v1.0.0-production"
          echo "Status: READY FOR CLOUD DEPLOYMENT"
