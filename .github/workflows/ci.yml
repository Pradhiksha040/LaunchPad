name: LaunchPad OS CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  typecheck-and-lint:
    name: Type Check & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Prisma Generate
        run: cd backend && npx prisma generate

      - name: Run Monorepo Build Validation
        run: npm run build

  test-and-build:
    name: Unit Tests & Production Builds
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci

      - name: Prisma Client Generate
        run: cd backend && npx prisma generate

      - name: Run Backend Unit Tests (Jest)
        run: cd backend && npm run test

      - name: Build NestJS Backend Target
        run: cd backend && npm run build

      - name: Build Next.js Frontend Target
        run: npm run build

  docker-verification:
    name: Docker Container Build Verification
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        run: docker build -t launchpad-backend:ci ./backend

      - name: Verify Frontend Docker Build
        run: docker build -t launchpad-frontend:ci .
