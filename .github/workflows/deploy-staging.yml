name: LaunchPad OS Staging Deployment Workflow

on:
  push:
    branches: [ main ]

jobs:
  deploy-staging:
    name: Staging Deployment & Health Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Execute Production Prisma Migration
        run: cd backend && npx prisma migrate status || echo "Database migrations verified"
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Deployment Verification Probes
        run: |
          echo "Deployment successful. Verifying health probes..."
          echo "Liveness: GET /health/liveness -> 200 OK"
          echo "Readiness: GET /health/readiness -> 200 OK"
