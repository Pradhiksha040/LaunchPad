version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchpad_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchpad_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-launchpad_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-launchpad_dev_user} -d $${POSTGRES_DB:-launchpad_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchpad-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://launchpad_dev_user:launchpad_dev_password@postgres:5432/launchpad_dev?schema=public}
      JWT_SECRET: ${JWT_SECRET:-launchpad_enterprise_jwt_secret_key_change_in_production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:4000}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchpad-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
