version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: always
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad_password
      POSTGRES_DB: launchpad_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: launchpad-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: launchpad-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: launchpad
      RABBITMQ_DEFAULT_PASS: launchpad_password

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-runner
    container_name: launchpad-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://launchpad:launchpad_password@postgres:5432/launchpad_os?schema=public"
      REDIS_URL: "redis://redis:6379"
      RABBITMQ_URL: "amqp://launchpad:launchpad_password@rabbitmq:5672"
      JWT_SECRET: "launchpad_enterprise_jwt_secret_key_2026_super_secure"
      MODE: "STANDALONE"
    depends_on:
      - postgres
      - redis
      - rabbitmq

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runner
    container_name: launchpad-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
