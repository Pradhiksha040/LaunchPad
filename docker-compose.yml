version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: launchpad-postgres
    restart: always
    environment:
      POSTGRES_USER: launchpad
      POSTGRES_PASSWORD: launchpad_password
      POSTGRES_DB: launchpad_os
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchpad -d launchpad_os"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: launchpad-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://launchpad:launchpad_password@postgres:5432/launchpad_os?schema=public"
      JWT_SECRET: "launchpad_enterprise_jwt_secret_key_2026_super_secure"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchpad-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
