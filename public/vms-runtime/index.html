      window.__VMS_API_URL__ = "https://api-securepass.prajai.in/api/";

      window.addEventListener('message', function(event) {
        if (!event.data || event.data.type !== 'LAUNCHPAD_VMS_INIT') return;
        const cfg = event.data.payload || {};
        if (cfg.organizationId) {
          localStorage.setItem('active_organization_id', cfg.organizationId);
        }
        if (cfg.companyId) {
          localStorage.setItem('active_company_id', cfg.companyId);
        }
        if (cfg.globalSettings) {
          localStorage.setItem('vms_global_settings', JSON.stringify(cfg.globalSettings));
        }
        if (cfg.primaryColor) {
          document.documentElement.style.setProperty('--color-primary', cfg.primaryColor);
        }
      });
